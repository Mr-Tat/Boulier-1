<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#f4f1ea" />
  <title>Boulier pédagogique 0–100 · v19</title>
  <style>
    :root{
      --paper:#f4f1ea;
      --ink:#18212b;
      --muted:#68717c;
      --wood:#9a673b;
      --wood-dark:#5b371f;
      --card:#fff;
      --accent:#345995;
      --slate:#263d35;
      --slate-dark:#172820;
      --chalk:#f3f0df;
      --shadow:0 12px 30px rgba(22,30,40,.12);
      --shell:#e6ebe5;
      --shell-dark:#dde3dd;
      --abacus-bg:#efe6d4;
      --abacus-bg-deep:#e6dac4;
      --stone:#d4cdc0;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,var(--shell),var(--shell-dark));
      overscroll-behavior:none;
    }
    button{font:inherit}

    .app{
      width:min(1240px,100%);
      height:100dvh;
      margin:0 auto;
      padding:5px 14px 8px;
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .topbar{
      flex:0 0 auto;
      min-height:32px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .title{
      display:flex;
      align-items:baseline;
      gap:7px;
      font-weight:950;
      letter-spacing:-.035em;
      font-size:clamp(21px,2.4vw,30px);
      white-space:nowrap;
    }
    .version-badge{
      font-size:.42em;
      font-weight:800;
      letter-spacing:.01em;
      color:#8b929b;
      opacity:.82;
    }
    .top-actions{
      display:flex;
      align-items:center;
      gap:7px;
      flex:0 0 auto;
    }
    .number-visibility-button{
      min-width:76px;
      height:34px;
      padding:0 11px;
      border:1px solid rgba(23,32,42,.12);
      border-radius:10px;
      background:rgba(255,255,255,.72);
      color:#24313e;
      box-shadow:0 3px 10px rgba(22,30,40,.10);
      cursor:pointer;
      font-size:13px;
      font-weight:850;
      touch-action:manipulation;
    }
    .number-visibility-button:hover{background:#fff}
    .number-visibility-button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .fullscreen-button{
      flex:0 0 auto;
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border:1px solid rgba(23,32,42,.12);
      border-radius:10px;
      background:rgba(255,255,255,.72);
      color:#24313e;
      box-shadow:0 3px 10px rgba(22,30,40,.10);
      cursor:pointer;
      font-size:21px;
      font-weight:900;
      line-height:1;
      padding:0;
      touch-action:manipulation;
    }
    .fullscreen-button:hover{background:#fff}
    .fullscreen-button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .top-note{
      color:#8a9198;
      font-size:11px;
      font-weight:750;
    }

    .main-layout{
      flex:1 1 auto;
      min-height:0;
      display:grid;
      grid-template-columns:238px 108px minmax(0,1fr);
      grid-template-rows:minmax(0,1fr) 54px;
      column-gap:10px;
      row-gap:6px;
      align-items:stretch;
    }

    .left-panel{
      grid-column:1;
      grid-row:1 / 3;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    /* Ardoise : aucun vrai champ texte, afin d'éviter le clavier tactile système. */
    .slate{
      --answer-w:72px;
      --answer-gap:7px;
      --answer-pad:10px;
      position:relative;
      overflow:hidden;
      flex:0 0 auto;
      border:9px solid var(--wood);
      border-bottom-color:#80522e;
      border-right-color:#80522e;
      border-radius:12px;
      background:
        radial-gradient(circle at 20% 17%,rgba(255,255,255,.035),transparent 22%),
        radial-gradient(circle at 80% 70%,rgba(255,255,255,.025),transparent 25%),
        linear-gradient(145deg,var(--slate),var(--slate-dark));
      box-shadow:var(--shadow),inset 0 0 25px rgba(0,0,0,.30);
      color:var(--chalk);
      padding:13px 12px 15px;
      min-height:205px;
    }
    .slate::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background-image:
        repeating-linear-gradient(0deg,transparent 0 7px,rgba(255,255,255,.025) 8px),
        repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.035) 12px);
    }
    .slate-label{
      position:relative;
      z-index:1;
      font-family:"Segoe Print","Comic Sans MS",cursive;
      font-size:15px;
      font-weight:700;
      opacity:.78;
      text-align:center;
      margin-bottom:2px;
    }
    .number-display{
      position:relative;
      z-index:2;
      min-height:82px;
      border-radius:9px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 5px;
      outline:none;
      cursor:text;
      user-select:none;
      font-family:"Segoe Print","Comic Sans MS",cursive;
      font-size:clamp(58px,6.7vw,88px);
      line-height:1;
      font-weight:700;
      letter-spacing:-.05em;
      font-variant-numeric:tabular-nums;
      text-shadow:0 0 1px rgba(255,255,255,.85),1px 1px 0 rgba(255,255,255,.10);
    }
    .number-display.editing{
      box-shadow:inset 0 0 0 2px rgba(244,241,218,.55);
      background:rgba(255,255,255,.025);
    }
    .number-display.editing::after{
      content:"";
      width:3px;
      height:52px;
      background:rgba(244,241,218,.85);
      margin-left:7px;
      animation:blink 1s steps(1) infinite;
    }
    @keyframes blink{50%{opacity:0}}
    .number-display.invalid{animation:shake .16s linear 0s 2}
    @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

    .operation-panel{
      position:relative;
      z-index:2;
      display:none;
      margin-top:3px;
      font-family:"Segoe Print","Comic Sans MS",cursive;
    }
    .slate.calculating .operation-panel{display:block}
    /* En calcul, le nombre de départ reste visible, mais on récupère l'espace
       du libellé pour remonter le contenu de l'ardoise. */
    .slate.calculating .slate-label{display:none}
    .slate.calculating .number-display{display:flex;cursor:default;min-height:70px}
    .slate.calculating{min-height:205px;padding-top:6px}
    .operation-expression{
      min-height:70px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding:0 var(--answer-pad) 5px;
      font-size:clamp(48px,5.7vw,72px);
      line-height:1;
      font-weight:700;
      letter-spacing:.015em;
      font-variant-numeric:tabular-nums;
    }
    .operation-prefix{
      flex:0 0 auto;
      min-width:.62em;
      margin-right:4px;
      text-align:right;
    }
    .operation-places{
      display:grid;
      grid-template-columns:repeat(2,var(--answer-w));
      column-gap:var(--answer-gap);
      align-items:center;
    }
    .operation-place{
      display:grid;
      place-items:center;
      min-width:0;
    }
    .written-line{
      height:3px;
      margin:0 6px 10px;
      border-radius:999px;
      background:rgba(245,241,219,.88);
      box-shadow:0 1px 0 rgba(255,255,255,.18);
    }
    .answer-row{
      display:flex;
      align-items:flex-end;
      justify-content:flex-end;
      gap:var(--answer-gap);
      padding:0 var(--answer-pad);
    }
    .answer-column{
      display:grid;
      justify-items:center;
      gap:2px;
    }
    .answer-tag{
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      font-size:10px;
      line-height:1;
      font-weight:900;
      opacity:.62;
    }
    .answer-box{
      width:var(--answer-w);
      height:76px;
      border-radius:7px;
      border:2px solid rgba(244,241,218,.62);
      background:rgba(255,255,255,.035);
      display:grid;
      place-items:center;
      outline:none;
      cursor:pointer;
      user-select:none;
      font-family:"Segoe Print","Comic Sans MS",cursive;
      font-size:clamp(50px,5.25vw,68px);
      font-weight:700;
      line-height:1;
      color:var(--chalk);
    }
    .answer-box.active{
      border-color:#fffbe1;
      box-shadow:0 0 0 3px rgba(255,251,225,.14);
      background:rgba(255,255,255,.065);
    }
    .answer-box.correct{
      border-color:#9be7ad;
      box-shadow:0 0 0 3px rgba(99,214,124,.18);
      background:rgba(78,190,103,.14);
    }
    .answer-box.incorrect{
      border-color:#ffaca6;
      box-shadow:0 0 0 3px rgba(255,110,100,.15);
      background:rgba(220,76,69,.12);
    }

    .keypad{
      display:none;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
      padding:7px;
      border-radius:16px;
      background:#dfe5dc;
      border:1px solid rgba(23,32,42,.08);
      box-shadow:var(--shadow);
    }
    .keypad.show{display:grid}
    .keypad button{
      height:43px;
      border:0;
      border-radius:11px;
      background:#fff;
      color:#26323d;
      font-size:20px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 2px 6px rgba(0,0,0,.08);
      touch-action:manipulation;
    }
    .keypad button:active{transform:translateY(1px);box-shadow:none}
    .keypad .key-muted{background:#d8d4cc;font-size:16px}
    .keypad .verify-key{
      grid-column:1 / -1;
      background:var(--accent);
      color:#fff;
      font-size:17px;
      letter-spacing:.01em;
    }
    .keypad .verify-key.correct{background:#287a43}
    .keypad .verify-key.incorrect{background:#a33d37}
    .keypad .verify-key.incomplete{background:#756b58}

    .calc-actions{
      margin-top:auto;
      display:flex;
      gap:7px;
      width:100%;
    }
    .calc-trigger{
      margin-top:0;
      flex:1 1 auto;
      width:100%;
      min-height:58px;
      border:0;
      border-radius:17px;
      padding:10px 12px;
      background:var(--accent);
      color:#fff;
      font-size:19px;
      font-weight:950;
      cursor:pointer;
      box-shadow:0 9px 20px rgba(52,89,149,.24);
      touch-action:manipulation;
    }
    .calc-trigger.secondary{
      background:#d8ddd7;
      color:#2b3641;
      box-shadow:none;
      font-size:15px;
    }
    .base-reset{
      display:none;
      flex:0 0 42%;
      min-height:58px;
      border:0;
      border-radius:17px;
      padding:10px 8px;
      background:#dfe5dc;
      color:#33404c;
      font-size:16px;
      font-weight:950;
      cursor:pointer;
      box-shadow:none;
      touch-action:manipulation;
    }
    .base-reset.show{display:block}
    .base-reset:active{transform:translateY(1px)}

    .tens-control{
      grid-column:2;
      grid-row:1;
      position:relative;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      touch-action:none;
      user-select:none;
    }
    .tens-track{
      position:absolute;
      top:14px;
      bottom:14px;
      left:50%;
      width:5px;
      transform:translateX(-50%);
      border-radius:999px;
      background:#c8c3ba;
      z-index:1;
      pointer-events:none;
    }
    .control-knob{
      width:61px;
      height:61px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.92);
      background:radial-gradient(circle at 32% 27%,#667b95 0 8%,#31445c 32%,#172638 68%,#0e1825 100%);
      box-shadow:0 10px 21px rgba(20,37,56,.28),inset 0 3px 3px rgba(255,255,255,.17);
      color:#fff;
      display:grid;
      place-items:center;
      font-size:26px;
      font-weight:950;
      cursor:grab;
      outline:none;
      z-index:5;
      touch-action:none;
    }
    .control-knob:active{cursor:grabbing}
    .control-knob:focus-visible{box-shadow:0 0 0 4px #93c5fd,0 10px 21px rgba(20,37,56,.28)}

    .tens-ruler{
      position:absolute;
      right:0;
      top:50%;
      width:102px;
      height:min(98%,620px);
      transform:translateY(-50%);
      background:rgba(255,255,255,.98);
      border:1px solid rgba(23,32,42,.12);
      border-radius:18px;
      box-shadow:0 12px 30px rgba(0,0,0,.15);
      padding:7px 8px;
      opacity:0;
      pointer-events:none;
      transition:opacity .10s ease;
      z-index:4;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .tens-ruler.show{opacity:1}
    .tens-tick{
      min-height:22px;
      flex:1 1 0;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      color:#626d77;
      font-size:12px;
      font-weight:950;
      font-variant-numeric:tabular-nums;
    }
    .tens-tick::after{
      content:"";
      width:32px;
      height:4px;
      border-radius:999px;
      background:#9ca4ad;
    }
    .tens-tick.zero{color:#111827;font-size:13px}
    .tens-tick.zero::after{width:44px;height:6px;background:#25303b}
    .tens-tick.selected{color:#111827;transform:scale(1.08)}
    .tens-tick.selected::after{background:#345995;height:7px}

    .abacus-card{
      grid-column:3;
      grid-row:1;
      min-height:0;
      position:relative;
      background:linear-gradient(180deg,var(--abacus-bg),var(--abacus-bg-deep));
      border-radius:25px;
      box-shadow:var(--shadow);
      border:1px solid rgba(23,32,42,.08);
      overflow:hidden;
    }
    .abacus-frame{
      height:100%;
      min-height:400px;
      overflow-y:auto;
      scroll-snap-type:y proximity;
      scrollbar-width:thin;
      scrollbar-color:#b7afa3 transparent;
      background:linear-gradient(180deg,rgba(255,250,241,.35),rgba(214,199,172,.16)),linear-gradient(90deg,var(--wood-dark) 0 11px,transparent 11px calc(100% - 11px),var(--wood-dark) calc(100% - 11px));
      padding:10px 11px;
      overscroll-behavior:contain;
      touch-action:pan-y;
    }
    .row{
      height:88px;
      position:relative;
      display:grid;
      grid-template-columns:66px 1fr;
      align-items:center;
      scroll-snap-align:center;
    }
    .row-label{
      appearance:none;
      -webkit-appearance:none;
      font-family:inherit;
      cursor:pointer;
      position:relative;
      z-index:4;
      width:54px;
      margin-left:-11px;
      text-align:center;
      color:#fff;
      background:linear-gradient(180deg,#aa7747,#83542e);
      border:3px solid var(--wood-dark);
      border-left-width:5px;
      padding:5px 4px;
      border-radius:0 11px 11px 0;
      font-weight:950;
      font-size:18px;
      font-variant-numeric:tabular-nums;
      box-shadow:0 4px 8px rgba(66,38,18,.18);
    }
    .row-inner{
      height:100%;
      position:relative;
      display:flex;
      align-items:center;
      padding:0 12px 0 3px;
    }
    .rod{
      position:absolute;
      left:0;
      right:12px;
      height:7px;
      border-radius:999px;
      background:linear-gradient(#dfe2e7,#8d949d 45%,#f3f4f6 56%,#949aa3);
      box-shadow:0 2px 3px rgba(0,0,0,.16);
    }
    .beads{
      width:100%;
      display:flex;
      align-items:center;
      gap:clamp(3px,.48vw,7px);
      position:relative;
      z-index:2;
      min-width:0;
    }
    .bead{
      flex:0 0 clamp(24px,3.85vw,48px);
      width:clamp(24px,3.85vw,48px);
      aspect-ratio:1/1;
      border-radius:50%;
      border:1px solid rgba(12,18,25,.28);
      background:var(--c);
      background:
        radial-gradient(circle at 28% 23%,
          rgba(255,255,255,.98) 0 4%,
          rgba(255,255,255,.62) 6%,
          color-mix(in srgb,var(--c) 78%,white) 18%,
          var(--c) 49%,
          color-mix(in srgb,var(--c) 70%,black) 78%,
          color-mix(in srgb,var(--c) 38%,black) 100%);
      box-shadow:
        inset -7px -9px 11px rgba(0,0,0,.24),
        inset 5px 5px 8px rgba(255,255,255,.23),
        0 4px 6px rgba(0,0,0,.21);
      opacity:.14;
      transform:scale(.83);
      transition:transform .16s ease,opacity .12s ease,filter .12s ease,outline-color .12s ease,margin-left .18s ease;
      touch-action:pan-y;
      position:relative;
      --drag-x:0px;
      cursor:grab;
      user-select:none;
      -webkit-user-select:none;
    }
    /* La première boule inactive pousse tout le groupe inactif vers la droite.
       Les boules actives restent ainsi groupées à gauche comme sur un vrai boulier. */
    .bead.inactive-start{margin-left:auto}
    .bead.drag-source{
      z-index:8;
      cursor:grabbing;
      outline:4px solid rgba(52,89,149,.35);
      outline-offset:4px;
      transform:translateX(var(--drag-x)) scale(1.16) !important;
      transition:none !important;
      box-shadow:
        inset -7px -9px 11px rgba(0,0,0,.20),
        inset 5px 5px 8px rgba(255,255,255,.28),
        0 10px 18px rgba(25,38,53,.28);
    }
    .bead.drag-source::after{
      content:attr(data-drag-cue);
      position:absolute;
      left:50%;
      top:-31px;
      transform:translateX(-50%);
      min-width:max-content;
      padding:4px 7px;
      border-radius:999px;
      background:rgba(24,33,43,.88);
      color:white;
      font:800 11px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
      opacity:0;
      transition:opacity .08s ease;
      pointer-events:none;
      white-space:nowrap;
    }
    .bead.drag-source.drag-cue::after{opacity:1}
    .beads.dragging{
      isolation:isolate;
    }
    .beads.dragging .bead:not(.drag-source){
      transition:transform .12s ease,opacity .12s ease,filter .12s ease,margin-left .12s ease;
    }

    /* Avec une souris, le numéro absolu de la boule apparaît sans clic.
       Ce repère est volontairement absent au tactile, où il n'existe pas de survol. */
    @media (hover:hover) and (pointer:fine){
      .bead:hover{
        z-index:7;
        outline:3px solid rgba(52,89,149,.28);
        outline-offset:3px;
      }
      .bead:hover::before{
        content:attr(data-number);
        position:absolute;
        left:50%;
        top:-34px;
        transform:translateX(-50%);
        min-width:34px;
        padding:5px 8px;
        border-radius:10px;
        background:rgba(24,33,43,.94);
        color:#fff;
        font:900 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
        text-align:center;
        box-shadow:0 5px 12px rgba(0,0,0,.22);
        pointer-events:none;
        white-space:nowrap;
      }
      .bead.drag-source:hover::before{display:none}
    }

    /* Au tactile (et pendant un clic maintenu à la souris), le numéro de la
       boule reste visible dès l'appui et pendant tout le glissement. */
    .bead.drag-source::before{
      content:attr(data-number);
      display:block !important;
      position:absolute;
      left:50%;
      top:-67px;
      transform:translateX(-50%);
      min-width:42px;
      padding:7px 10px;
      border-radius:12px;
      background:rgba(24,33,43,.96);
      color:#fff;
      font:950 20px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
      text-align:center;
      box-shadow:0 7px 16px rgba(0,0,0,.26);
      pointer-events:none;
      white-space:nowrap;
      z-index:12;
    }

    .bead.active{opacity:1;transform:scale(1);filter:saturate(1.14)}
    /* En calcul, les boules qui ne faisaient pas partie du nombre de départ
       restent petites. Elles retrouvent leur taille normale uniquement si
       elles sont réellement ajoutées. */
    .bead.not-base{
      opacity:.11;
      transform:scale(.61);
      filter:saturate(.72) brightness(.92);
    }
    .bead.fixed{
      opacity:1;
      transform:scale(1);
      filter:brightness(.47) saturate(.82) contrast(1.08);
      box-shadow:inset -7px -9px 11px rgba(0,0,0,.34),inset 4px 4px 7px rgba(255,255,255,.10),0 3px 5px rgba(0,0,0,.22);
    }
    .bead.added{
      opacity:1;
      transform:scale(1.03);
      filter:saturate(1.22) brightness(1.03);
      outline:2px solid rgba(52,89,149,.18);
    }
    /* Une boule retirée appartenait au nombre de départ : elle garde presque
       sa taille normale afin de rester très distincte des petites boules
       qui n'ont jamais fait partie du nombre de base. */
    .bead.removed{
      opacity:.32;
      transform:scale(.98);
      filter:brightness(.43) saturate(.62);
      outline:2px dashed rgba(38,51,62,.42);
      outline-offset:2px;
    }
    .row.current .row-label{outline:4px solid rgba(52,89,149,.22)}

    /* Focus sur une dizaine : la ligne choisie et ses deux voisines restent
       pleinement visibles. Les autres s'effacent sans changer la géométrie
       du boulier, ce qui est utile pour observer un passage de dizaine. */
    .row, .row .row-inner, .row .row-label{
      transition:opacity .28s ease,filter .28s ease,transform .22s ease,box-shadow .22s ease;
    }
    .abacus-frame.focus-mode .row.focus-dimmed .row-inner{
      opacity:.22;
      filter:grayscale(.48) brightness(1.045);
      pointer-events:none;
    }
    .abacus-frame.focus-mode .row.focus-dimmed .row-label{
      opacity:.42;
      filter:saturate(.62);
    }
    .abacus-frame.focus-mode .row.focus-near{
      opacity:1;
    }
    .abacus-frame.focus-mode .row.focus-center .row-label{
      opacity:1;
      outline:4px solid rgba(52,89,149,.44);
      outline-offset:2px;
      box-shadow:0 7px 15px rgba(52,89,149,.24),0 4px 8px rgba(66,38,18,.18);
      transform:scale(1.06);
    }
    .row-label:focus-visible{
      outline:4px solid rgba(52,89,149,.52);
      outline-offset:3px;
    }
    @media (prefers-reduced-motion:reduce){
      .row, .row .row-inner, .row .row-label{transition:none !important}
    }

    .units-panel{
      grid-column:3;
      grid-row:2;
      min-height:0;
      background:linear-gradient(180deg,var(--abacus-bg),var(--abacus-bg-deep));
      border:1px solid rgba(23,32,42,.08);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:4px 10px;
      display:grid;
      grid-template-columns:1fr;
      align-items:center;
    }
    .horizontal-control{
      height:50px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      touch-action:none;
      user-select:none;
    }
    .units-track{
      position:absolute;
      left:14px;
      right:14px;
      height:5px;
      border-radius:999px;
      background:#c8c3ba;
    }
    .units-knob{width:48px;height:48px;font-size:22px}
    .units-ruler{
      position:absolute;
      left:7px;
      right:7px;
      top:0;
      height:50px;
      border-radius:14px;
      background:rgba(255,255,255,.98);
      border:1px solid rgba(23,32,42,.12);
      box-shadow:0 8px 20px rgba(0,0,0,.13);
      padding:4px 8px 2px;
      display:grid;
      grid-template-columns:repeat(19,1fr);
      align-items:end;
      opacity:0;
      pointer-events:none;
      transition:opacity .10s ease;
      z-index:4;
    }
    .units-ruler.show{opacity:1}
    .unit-tick{
      height:20px;
      border-left:3px solid #9ea5ad;
      position:relative;
      justify-self:center;
    }
    .unit-tick.zero{height:31px;border-left-width:4px;border-color:#202a35}
    .unit-tick.selected{height:34px;border-color:#345995;border-left-width:5px}
    .unit-tick span{
      position:absolute;
      top:-15px;
      left:0;
      transform:translateX(-50%);
      font-size:9px;
      font-weight:900;
      color:#66707a;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }
    .unit-tick.zero span{color:#18212b}

    .finger-value{
      position:fixed;
      z-index:100;
      min-width:78px;
      padding:9px 12px;
      border-radius:15px;
      background:#17212c;
      color:#fff;
      text-align:center;
      font-size:25px;
      line-height:1;
      font-weight:950;
      font-variant-numeric:tabular-nums;
      box-shadow:0 10px 26px rgba(0,0,0,.25);
      opacity:0;
      pointer-events:none;
      transform:translate(-50%,-50%) scale(.9);
      transition:opacity .08s ease,transform .08s ease;
    }
    .finger-value.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

    /* Sur écran d'ordinateur, le boulier remonte seul dans l'espace libre de l'en-tête.
       La marge négative agrandit sa boîte sans déplacer l'ardoise, les contrôles
       ou la barre d'unités. */
    @media (min-width:761px){
      .abacus-card{margin-top:-37px}
    }

    @media (max-width:760px){
      body{overflow:auto}
      .app{height:auto;min-height:100dvh;padding:8px}
      .topbar{min-height:30px}
      .top-note{display:none}
      .main-layout{
        display:grid;
        grid-template-columns:110px 68px minmax(0,1fr);
        grid-template-rows:430px 54px auto;
        column-gap:5px;
      }
      .left-panel{grid-column:1;grid-row:1 / 3}
      .slate{border-width:6px;padding:8px 5px;min-height:174px}
      .slate-label{font-size:12px}
      .number-display{min-height:66px;font-size:48px}
      .operation-expression{font-size:34px;min-height:52px}
      .slate{--answer-w:39px;--answer-gap:4px;--answer-pad:0px}
      .answer-row{padding:0}
      .answer-box{height:43px;font-size:28px}
      .keypad{grid-template-columns:repeat(3,1fr);gap:4px;padding:5px}
      .keypad button{height:37px;font-size:17px}
      .calc-trigger{min-height:50px;font-size:16px}
      .base-reset{min-height:50px;font-size:13px;padding:7px 5px}
      .number-visibility-button{min-width:68px;padding:0 8px;font-size:12px}
      .control-knob{width:49px;height:49px;font-size:21px}
      .tens-ruler{width:68px;padding:6px 4px}
      .tens-tick{font-size:9px;gap:3px}
      .tens-tick::after{width:21px;height:4px}
      .tens-tick.zero::after{width:28px}
      .abacus-frame{min-height:430px}
      .row{height:82px;grid-template-columns:51px 1fr}
      .row-label{width:45px;font-size:14px}
      .beads{gap:2px}
      .bead{flex-basis:clamp(18px,5.05vw,36px);width:clamp(18px,5.05vw,36px)}
      .units-panel{grid-column:1 / 4;grid-row:3;grid-template-columns:1fr;padding:5px 7px}
    }

    @media (max-height:760px) and (min-width:761px){
      .slate{padding-top:9px;padding-bottom:10px}
      .number-display{min-height:72px;font-size:clamp(54px,6vw,78px)}
      .operation-expression{min-height:58px;font-size:clamp(44px,5vw,62px);padding-bottom:2px}
      .slate{--answer-w:62px}
      .answer-box{height:66px;font-size:46px}
      .keypad{gap:4px;padding:5px}
      .keypad button{height:38px}
      .calc-trigger{min-height:50px}
    }


    /* Portrait (PC/tablette) et petits écrans : l'ardoise passe au-dessus du
       boulier afin de lui rendre toute la largeur disponible. En paysage sur
       un grand écran, la disposition en colonne gauche reste inchangée. */
    @media (orientation:portrait), (max-width:760px){
      .main-layout{
        grid-template-columns:78px minmax(0,1fr);
        grid-template-rows:auto minmax(0,1fr) 54px auto auto;
        column-gap:7px;
        row-gap:6px;
      }

      /* Le conteneur de gauche s'efface visuellement : ses enfants deviennent
         directement des éléments de la grille principale. */
      .left-panel{display:contents}

      .slate{
        grid-column:1 / -1;
        grid-row:1;
        width:100%;
        min-height:126px;
        padding-top:7px;
        padding-bottom:9px;
      }
      .slate-label{margin-bottom:0}
      .number-display{
        min-height:76px;
        font-size:clamp(56px,10vw,88px);
      }
      .slate.calculating{
        min-height:205px;
        padding-top:5px;
      }
      .slate.calculating .number-display{min-height:66px}
      .operation-expression{
        min-height:60px;
        font-size:clamp(46px,8.5vw,72px);
      }

      .tens-control{
        grid-column:1;
        grid-row:2;
        min-height:0;
      }
      .abacus-card{
        grid-column:2;
        grid-row:2;
        margin-top:0;
        min-height:0;
      }
      .abacus-frame{
        height:100%;
        min-height:0;
      }
      .units-panel{
        grid-column:1 / -1;
        grid-row:3;
      }
      .keypad{
        grid-column:1 / -1;
        grid-row:4;
      }
      .calc-actions{
        grid-column:1 / -1;
        grid-row:5;
        margin-top:0;
      }
    }

    /* Sur un écran vertical de PC/tablette, on reste dans la hauteur de
       l'écran : tout l'espace central restant est attribué au boulier. */
    @media (orientation:portrait) and (min-width:761px){
      body{overflow:hidden}
      .app{height:100dvh;min-height:0}
      .main-layout{min-height:0}
      .row{height:90px}
      .bead{
        flex-basis:clamp(28px,4.4vw,52px);
        width:clamp(28px,4.4vw,52px);
      }
    }

    /* Sur téléphone, même principe mais avec défilement de la page si le
       clavier de réponse est ouvert : le boulier conserve une vraie zone de
       manipulation au lieu d'être comprimé. */
    @media (max-width:760px){
      body{overflow:auto}
      .app{height:auto;min-height:100dvh;padding:8px}
      .main-layout{
        grid-template-columns:62px minmax(0,1fr);
        grid-template-rows:auto 430px 54px auto auto;
        column-gap:5px;
      }
      .slate{
        border-width:6px;
        padding:7px 8px 9px;
        min-height:118px;
        --answer-w:58px;
        --answer-gap:8px;
        --answer-pad:8px;
      }
      .slate.calculating{min-height:194px;padding-top:4px}
      .slate-label{font-size:12px}
      .number-display{min-height:66px;font-size:clamp(48px,15vw,68px)}
      .slate.calculating .number-display{min-height:58px}
      .operation-expression{font-size:clamp(39px,12vw,56px);min-height:50px}
      .answer-box{height:58px;font-size:clamp(38px,11vw,52px)}

      .control-knob{width:49px;height:49px;font-size:21px}
      .tens-ruler{width:62px;padding:6px 3px}
      .tens-tick{font-size:8px;gap:2px}
      .tens-tick::after{width:18px;height:4px}
      .tens-tick.zero::after{width:24px}

      .row{height:82px;grid-template-columns:51px 1fr}
      .row-label{width:45px;font-size:14px}
      .beads{gap:2px}
      .bead{
        flex-basis:clamp(17px,4.8vw,31px);
        width:clamp(17px,4.8vw,31px);
      }
      .units-panel{padding:5px 7px}
      .keypad{grid-template-columns:repeat(3,1fr);gap:4px;padding:5px}
      .keypad button{height:37px;font-size:17px}
      .calc-trigger{min-height:50px;font-size:16px}
      .base-reset{min-height:50px;font-size:13px;padding:7px 5px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title">Boulier 0–100 <span class="version-badge">v19</span></div>
    <div class="top-actions">
      <button
        class="number-visibility-button"
        id="numberVisibilityButton"
        type="button"
        aria-pressed="false"
        title="Masquer le nombre"
      >Masquer</button>
      <button
        class="fullscreen-button"
        id="fullscreenButton"
        type="button"
        aria-label="Passer en plein écran"
        title="Passer en plein écran"
      >⛶</button>
    </div>
  </header>

  <main class="main-layout">
    <section class="left-panel">
      <section class="slate" id="slate" aria-label="Ardoise du nombre et du calcul">
        <div class="slate-label" id="slateLabel">Nombre</div>
        <div
          class="number-display"
          id="numberDisplay"
          role="spinbutton"
          tabindex="0"
          inputmode="none"
          aria-label="Nombre. Cliquer puis écrire avec le clavier physique."
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          title="Cliquer ici puis taper un nombre de 0 à 100"
        >0</div>

        <div class="operation-panel" id="operationPanel">
          <div class="operation-expression" id="operationExpression" aria-label="Calcul en cours">
            <span class="operation-prefix" id="operationPrefix">+</span>
            <span class="operation-places" aria-hidden="true">
              <span class="operation-place" id="operationTens"></span>
              <span class="operation-place" id="operationUnits">0</span>
            </span>
          </div>
          <div class="written-line"></div>
          <div class="answer-row" aria-label="Réponse chiffre par chiffre">
            <div class="answer-column">
              <div class="answer-tag">D</div>
              <div class="answer-box" id="answerTens" role="button" tabindex="0" inputmode="none" aria-label="Chiffre des dizaines"></div>
            </div>
            <div class="answer-column">
              <div class="answer-tag">U</div>
              <div class="answer-box" id="answerUnits" role="button" tabindex="0" inputmode="none" aria-label="Chiffre des unités"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="keypad" id="keypad" aria-label="Clavier numérique tactile">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="key-muted" data-action="clear">C</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" class="key-muted" data-action="backspace">⌫</button>
        <button type="button" class="verify-key" id="verifyButton" data-action="verify">Vérifier</button>
      </section>

      <div class="calc-actions">
        <button class="base-reset" id="baseResetButton" type="button" title="Revenir au nombre de départ">↶ Départ</button>
        <button class="calc-trigger" id="calcTrigger" type="button">Calcul</button>
      </div>
    </section>

    <aside class="tens-control" aria-label="Contrôle des dizaines">
      <div class="tens-track" aria-hidden="true"></div>
      <div class="tens-ruler" id="tensRuler" aria-hidden="true"></div>
      <div
        class="control-knob"
        id="tensKnob"
        role="slider"
        tabindex="0"
        aria-label="Ajouter ou enlever jusqu'à cent par dizaines"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        title="Haut : jusqu'à +100 · Bas : jusqu'à −100"
      >↕</div>
    </aside>

    <section class="abacus-card">
      <div class="abacus-frame" id="abacus" aria-label="Boulier de 0 à 100"></div>
    </section>

    <section class="units-panel" aria-label="Contrôle des unités">
      <div class="horizontal-control">
        <div class="units-track"></div>
        <div class="units-ruler" id="unitsRuler" aria-hidden="true"></div>
        <div
          class="control-knob units-knob"
          id="unitsKnob"
          role="slider"
          tabindex="0"
          aria-label="Ajouter ou enlever jusqu'à neuf unités"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          title="Gauche : enlever jusqu'à 9 unités · Droite : ajouter jusqu'à 9 unités"
        >↔</div>
      </div>
    </section>
  </main>
</div>

<div class="finger-value" id="fingerValue">0</div>

<script>
(() => {
  "use strict";

  const abacus = document.getElementById("abacus");
  const slate = document.getElementById("slate");
  const slateLabel = document.getElementById("slateLabel");
  const numberDisplay = document.getElementById("numberDisplay");
  const operationExpression = document.getElementById("operationExpression");
  const operationPrefix = document.getElementById("operationPrefix");
  const operationTens = document.getElementById("operationTens");
  const operationUnits = document.getElementById("operationUnits");
  const answerTens = document.getElementById("answerTens");
  const answerUnits = document.getElementById("answerUnits");
  const keypad = document.getElementById("keypad");
  const verifyButton = document.getElementById("verifyButton");
  const calcTrigger = document.getElementById("calcTrigger");
  const baseResetButton = document.getElementById("baseResetButton");
  const numberVisibilityButton = document.getElementById("numberVisibilityButton");
  const tensKnob = document.getElementById("tensKnob");
  const unitsKnob = document.getElementById("unitsKnob");
  const tensRuler = document.getElementById("tensRuler");
  const unitsRuler = document.getElementById("unitsRuler");
  const fingerValue = document.getElementById("fingerValue");
  const fullscreenButton = document.getElementById("fullscreenButton");

  let mode = "number";
  let value = 0;
  let baseValue = null;
  let calcTensDelta = 0;
  let calcUnitsDelta = 0;
  let scrollTimer = null;
  let numberBuffer = "0";
  let numberTypingFresh = true;
  let numberHidden = false;
  let activeAnswer = null;
  const answer = { tens:"", units:"" };
  let focusedDecade = null;
  // Le focus fonctionne comme une fenêtre stable de trois lignes.
  // Il ne se déplace que lorsque la valeur sort de la ligne centrale et de
  // ses deux voisines, afin de garder lisible un passage de dizaine.
  let focusFollowValue = null;

  const hues = [2,27,49,92,150,184,215,248,290,332];

  function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
  function signed(n){ return n > 0 ? `+${n}` : `${n}`; }
  function labelForDecade(decade){
    const n = (decade-1)*10;
    return n === 0 ? "00" : String(n);
  }


  function beadColor(rowIndexFromBottom,unitIndex){
    // Fort contraste vertical : très clair en bas, nettement foncé en haut.
    let lightness = 82 - rowIndexFromBottom * 6.8;
    if(unitIndex === 2) lightness = Math.max(lightness,30);
    const saturation = unitIndex === 2 ? 94 : 82;
    return `hsl(${hues[unitIndex]} ${saturation}% ${lightness}%)`;
  }

  function buildAbacus(){
    abacus.innerHTML = "";
    for(let decade=10; decade>=1; decade--){
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.decade = decade;
      row.innerHTML = `
        <button type="button" class="row-label" aria-pressed="false" title="Se concentrer sur ${labelForDecade(decade)}">${labelForDecade(decade)}</button>
        <div class="row-inner">
          <div class="rod"></div>
          <div class="beads"></div>
        </div>`;
      const beads = row.querySelector(".beads");
      for(let i=0;i<10;i++){
        const bead = document.createElement("div");
        bead.className = "bead";
        bead.style.setProperty("--c",beadColor(decade-1,i));
        const beadNumber = (decade-1)*10+i+1;
        bead.dataset.absolute = beadNumber;
        bead.dataset.number = beadNumber;
        bead.title = `Boule ${beadNumber}`;
        bead.setAttribute("aria-hidden","true");
        beads.appendChild(bead);
      }
      const rowLabel = row.querySelector(".row-label");
      rowLabel.addEventListener("click",() => toggleDecadeFocus(decade));
      abacus.appendChild(row);
    }
    render(false);
    requestAnimationFrame(() => { abacus.scrollTop = abacus.scrollHeight; });
  }

  function decadeForValue(v){
    const visible = clamp(Math.round(v),0,100);
    return visible === 0 ? 1 : clamp(Math.ceil(visible/10),1,10);
  }

  function centerDecade(decade,behavior="smooth"){
    const row = abacus.querySelector(`[data-decade="${decade}"]`);
    if(!row) return;
    const top = row.offsetTop-(abacus.clientHeight-row.clientHeight)/2;
    abacus.scrollTo({top,behavior});
  }

  function followDecadeFocus(displayed){
    if(focusedDecade === null){
      focusFollowValue = null;
      return;
    }

    const nextDecade = decadeForValue(displayed);
    focusFollowValue = displayed;

    // La ligne centrale + la ligne du dessus + celle du dessous constituent
    // une fenêtre de travail. Un passage sur une ligne voisine ne recentre
    // donc pas le focus : on garde le contexte du passage de dizaine.
    if(Math.abs(nextDecade-focusedDecade) <= 1) return;

    // Si la valeur sort de cette fenêtre, on déplace le focus sur la nouvelle
    // dizaine atteinte. Les trois lignes visibles deviennent alors ses voisines.
    focusedDecade = nextDecade;
    requestAnimationFrame(() => centerDecade(focusedDecade,"smooth"));
  }

  function applyDecadeFocus(){
    const hasFocus = focusedDecade !== null;
    abacus.classList.toggle("focus-mode",hasFocus);

    abacus.querySelectorAll(".row").forEach(row => {
      const decade = Number(row.dataset.decade);
      const isCenter = hasFocus && decade === focusedDecade;
      const isNear = hasFocus && Math.abs(decade-focusedDecade) <= 1;
      row.classList.toggle("focus-center",isCenter);
      row.classList.toggle("focus-near",isNear);
      row.classList.toggle("focus-dimmed",hasFocus && !isNear);
      const label = row.querySelector(".row-label");
      if(label){
        label.setAttribute("aria-pressed",String(isCenter));
        label.title = isCenter
          ? "Réafficher tout le boulier"
          : `Se concentrer sur ${labelForDecade(decade)}`;
      }
    });
  }

  function toggleDecadeFocus(decade){
    focusedDecade = focusedDecade === decade ? null : decade;
    // Mémorise le nombre actuel. Le focus manuel reste ensuite stable tant que
    // la valeur reste dans sa fenêtre de trois lignes.
    focusFollowValue = focusedDecade === null ? null : currentTarget();
    applyDecadeFocus();

    if(focusedDecade !== null) centerDecade(focusedDecade,"smooth");
  }

  function buildRulers(){
    tensRuler.innerHTML = "";
    for(let step=10; step>=-10; step--){
      const tick = document.createElement("div");
      tick.className = "tens-tick" + (step===0 ? " zero" : "");
      tick.dataset.step = step;
      tick.textContent = step===0 ? "0" : signed(step*10);
      tensRuler.appendChild(tick);
    }

    unitsRuler.innerHTML = "";
    for(let step=-9; step<=9; step++){
      const tick = document.createElement("div");
      tick.className = "unit-tick" + (step===0 ? " zero" : "");
      tick.dataset.step = step;
      const label = document.createElement("span");
      label.textContent = step===0 ? "0" : signed(step);
      tick.appendChild(label);
      unitsRuler.appendChild(tick);
    }
  }

  function currentTarget(){
    return mode === "calc" && baseValue !== null
      ? baseValue + calcTensDelta + calcUnitsDelta
      : value;
  }

  function setCurrentTarget(next,shouldScroll=true){
    // En mode Nombre, le geste déplace directement le nombre affiché.
    next = clamp(Math.round(next),0,100);
    value = next;
    numberBuffer = String(next);
    render(shouldScroll);
  }

  function setCalcComponent(kind,delta,shouldScroll=true){
    if(mode !== "calc" || baseValue === null) return;
    clearVerification();

    if(kind === "tens"){
      let step = clamp(Math.round(delta/10),-10,10);

      /* On autorise une dizaine de dépassement seulement si elle peut encore
         être compensée par au plus 9 unités : sous-total de -9 à 109.
         Cela permet par exemple 18 - 20 + 2, sans autoriser un dépassement
         qui ne pourrait plus revenir dans le boulier 0–100. */
      while(step !== 0){
        const subtotal = baseValue + step*10;
        if(subtotal >= -9 && subtotal <= 109) break;
        step += step > 0 ? -1 : 1;
      }
      calcTensDelta = step*10;

      // Si un ancien choix d'unités ferait dépasser même la marge virtuelle,
      // on le remet à zéro : l'élève pourra choisir ensuite sa compensation.
      const withOldUnits = baseValue + calcTensDelta + calcUnitsDelta;
      if(withOldUnits < -9 || withOldUnits > 109) calcUnitsDelta = 0;
    }else{
      let units = clamp(Math.round(delta),-9,9);
      const subtotal = baseValue + calcTensDelta;
      // Le choix des unités ramène le résultat réel dans 0–100.
      units = clamp(units,Math.max(-9,-subtotal),Math.min(9,100-subtotal));
      calcUnitsDelta = units;
    }

    value = currentTarget();
    render(shouldScroll);
    return kind === "tens" ? calcTensDelta : calcUnitsDelta;
  }

  function calculationText(){
    const delta = calcTensDelta + calcUnitsDelta;
    return delta >= 0 ? `+${delta}` : `−${Math.abs(delta)}`;
  }

  function renderOperationExpression(){
    const delta = calcTensDelta + calcUnitsDelta;
    const absolute = Math.abs(delta);
    const digits = String(absolute);
    const lastTwo = digits.padStart(2,"0").slice(-2);
    const leading = digits.length > 2 ? digits.slice(0,-2) : "";

    operationPrefix.textContent = (delta >= 0 ? "+" : "−") + leading;
    // Pour +4, la colonne D reste vide et le 4 tombe exactement au-dessus de U.
    operationTens.textContent = absolute < 10 ? "" : lastTwo[0];
    operationUnits.textContent = lastTwo[1];
    operationExpression.setAttribute("aria-label",calculationText());
  }

  function renderBeads(displayed){
    const visible = clamp(displayed,0,100);

    document.querySelectorAll(".row").forEach(row => {
      const decade = Number(row.dataset.decade);
      const rowBase = (decade-1)*10;
      const activeCount = clamp(Math.round(visible-rowBase),0,10);
      const beads = [...row.querySelectorAll(".bead")];

      beads.forEach((bead,index) => {
        const n = Number(bead.dataset.absolute);
        bead.classList.remove("active","fixed","added","removed","not-base","inactive-start");

        // Crée l'espace central : actives à gauche, inactives à droite.
        if(index === activeCount && activeCount < 10) bead.classList.add("inactive-start");

        if(mode !== "calc" || baseValue === null){
          if(n <= visible) bead.classList.add("active");
          return;
        }

        if(n > baseValue) bead.classList.add("not-base");

        if(displayed >= baseValue){
          if(n <= baseValue) bead.classList.add("fixed");
          else if(n <= visible){
            bead.classList.remove("not-base");
            bead.classList.add("added");
          }
        }else{
          if(n <= visible) bead.classList.add("fixed");
          else if(n <= baseValue) bead.classList.add("removed");
        }
      });
    });
  }

  function render(shouldScroll=true){
    const displayed = currentTarget();
    value = displayed;
    tensKnob.setAttribute("aria-valuenow",displayed);
    unitsKnob.setAttribute("aria-valuenow",displayed);

    if(mode === "number"){
      slate.classList.remove("calculating");
      slateLabel.textContent = "Nombre";
      numberDisplay.textContent = numberHidden ? "?" : displayed;
      numberDisplay.setAttribute("aria-valuenow",displayed);
      calcTrigger.textContent = "Calcul";
      calcTrigger.classList.remove("secondary");
      baseResetButton.classList.remove("show");
    }else{
      slate.classList.add("calculating");
      slateLabel.textContent = "Nombre";
      numberDisplay.textContent = numberHidden ? "?" : baseValue;
      numberDisplay.classList.remove("editing");
      numberDisplay.setAttribute("aria-valuenow",baseValue);
      renderOperationExpression();
      calcTrigger.textContent = "Terminer";
      calcTrigger.classList.add("secondary");
      baseResetButton.classList.add("show");
    }

    renderBeads(displayed);
    followDecadeFocus(displayed);
    applyDecadeFocus();
    answerTens.textContent = answer.tens;
    answerUnits.textContent = answer.units;

    document.querySelectorAll(".row").forEach(row => row.classList.remove("current"));
    const visibleDisplayed = clamp(displayed,0,100);
    if(visibleDisplayed > 0){
      const decade = Math.ceil(visibleDisplayed/10);
      const row = abacus.querySelector(`[data-decade="${decade}"]`);
      if(row) row.classList.add("current");
    }

    if(shouldScroll) scheduleScrollToValue(displayed);
  }

  function scheduleScrollToValue(v){
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      v = clamp(v,0,100);
      const valueDecade = v===0 ? 1 : Math.ceil(v/10);
      // En mode focus, la vue reste centrée sur la ligne de focus tant que
      // l'on travaille dans ses trois lignes. followDecadeFocus() aura déjà
      // déplacé focusedDecade si la valeur est réellement sortie de la fenêtre.
      const decade = focusedDecade !== null ? focusedDecade : valueDecade;
      const row = abacus.querySelector(`[data-decade="${decade}"]`);
      if(!row) return;
      const top = row.offsetTop-(abacus.clientHeight-row.clientHeight)/2;
      abacus.scrollTo({top,behavior:"smooth"});
    },90);
  }

  function setSelectedTick(ruler,step){
    ruler.querySelectorAll("[data-step]").forEach(t => {
      t.classList.toggle("selected",Number(t.dataset.step)===step);
    });
  }

  function showFingerValue(text,x,y,axis){
    fingerValue.textContent = text;
    let left=x,top=y;
    if(axis === "y"){
      left = clamp(x+78,54,window.innerWidth-54);
      top = clamp(y,42,window.innerHeight-42);
    }else{
      left = clamp(x,54,window.innerWidth-54);
      top = clamp(y-62,42,window.innerHeight-42);
    }
    fingerValue.style.left = `${left}px`;
    fingerValue.style.top = `${top}px`;
    fingerValue.classList.add("show");
  }
  function hideFingerValue(){ fingerValue.classList.remove("show"); }

  function leaveNumberEditing(){
    numberDisplay.classList.remove("editing");
    numberTypingFresh = true;
  }

  function setupTensDrag(){
    let active=false,startY=0,startValue=0,lastStep=0,pxPerStep=26;

    tensKnob.addEventListener("pointerdown",e => {
      leaveNumberEditing();
      active=true;
      tensKnob.setPointerCapture(e.pointerId);
      startY=e.clientY;
      startValue=currentTarget();
      lastStep=0;
      pxPerStep=Math.max(18,(tensRuler.clientHeight-24)/20);
      tensRuler.classList.add("show");
      setSelectedTick(tensRuler,0);
      showFingerValue("0",e.clientX,e.clientY,"y");
      e.preventDefault();
    });

    tensKnob.addEventListener("pointermove",e => {
      if(!active) return;
      const step=clamp(Math.round((startY-e.clientY)/pxPerStep),-10,10);
      let shownStep=step;
      if(step!==lastStep){
        lastStep=step;
        if(mode === "calc" && baseValue !== null){
          shownStep=setCalcComponent("tens",step*10,false)/10;
        }else{
          setCurrentTarget(startValue+step*10,false);
        }
        setSelectedTick(tensRuler,shownStep);
      }else if(mode === "calc" && baseValue !== null){
        shownStep=calcTensDelta/10;
      }
      showFingerValue(shownStep===0 ? "0" : signed(shownStep*10),e.clientX,e.clientY,"y");
    });

    const end=e => {
      if(!active) return;
      active=false;
      try{tensKnob.releasePointerCapture(e.pointerId);}catch(_){ }
      tensRuler.classList.remove("show");
      setSelectedTick(tensRuler,99);
      hideFingerValue();
      scheduleScrollToValue(currentTarget());
    };
    tensKnob.addEventListener("pointerup",end);
    tensKnob.addEventListener("pointercancel",end);

    tensKnob.addEventListener("keydown",e => {
      let delta=0;
      if(e.key==="ArrowUp") delta=10;
      if(e.key==="ArrowDown") delta=-10;
      if(!delta) return;
      e.preventDefault();
      if(mode === "calc" && baseValue !== null){
        setCalcComponent("tens",calcTensDelta+delta);
      }else{
        setCurrentTarget(currentTarget()+delta);
      }
    });
  }

  function setupUnitsDrag(){
    let active=false,startX=0,startValue=0,lastStep=0,pxPerStep=26;

    unitsKnob.addEventListener("pointerdown",e => {
      leaveNumberEditing();
      active=true;
      unitsKnob.setPointerCapture(e.pointerId);
      startX=e.clientX;
      startValue=currentTarget();
      lastStep=0;
      const usable=Math.max(234,unitsRuler.clientWidth-28);
      pxPerStep=usable/18;
      unitsRuler.classList.add("show");
      setSelectedTick(unitsRuler,0);
      showFingerValue("0",e.clientX,e.clientY,"x");
      e.preventDefault();
    });

    unitsKnob.addEventListener("pointermove",e => {
      if(!active) return;
      const step=clamp(Math.round((e.clientX-startX)/pxPerStep),-9,9);
      let shownStep=step;
      if(step!==lastStep){
        lastStep=step;
        if(mode === "calc" && baseValue !== null){
          shownStep=setCalcComponent("units",step,false);
        }else{
          setCurrentTarget(startValue+step,false);
        }
        setSelectedTick(unitsRuler,shownStep);
      }else if(mode === "calc" && baseValue !== null){
        shownStep=calcUnitsDelta;
      }
      showFingerValue(shownStep===0 ? "0" : signed(shownStep),e.clientX,e.clientY,"x");
    });

    const end=e => {
      if(!active) return;
      active=false;
      try{unitsKnob.releasePointerCapture(e.pointerId);}catch(_){ }
      unitsRuler.classList.remove("show");
      setSelectedTick(unitsRuler,99);
      hideFingerValue();
      scheduleScrollToValue(currentTarget());
    };
    unitsKnob.addEventListener("pointerup",end);
    unitsKnob.addEventListener("pointercancel",end);

    unitsKnob.addEventListener("keydown",e => {
      let delta=0;
      if(e.key==="ArrowRight") delta=1;
      if(e.key==="ArrowLeft") delta=-1;
      if(!delta) return;
      e.preventDefault();
      if(mode === "calc" && baseValue !== null){
        setCalcComponent("units",calcUnitsDelta+delta);
      }else{
        setCurrentTarget(currentTarget()+delta);
      }
    });
  }

  function setTargetFromBead(desired,shouldScroll=false){
    desired = clamp(Math.round(desired),0,100);
    clearVerification();

    if(mode !== "calc" || baseValue === null){
      setCurrentTarget(desired,shouldScroll);
      return true;
    }

    /* Une manipulation directe du boulier désigne un résultat complet,
       même si la boule choisie se trouve dans une autre dizaine.
       On remplace donc ENSEMBLE les composantes dizaines et unités du calcul,
       au lieu d'essayer de faire tenir tout le déplacement dans ±9 unités.

       Exemple : base 43, cible 27 => delta -16 => -10 et -6.
       Les réglettes peuvent ensuite être utilisées pour choisir volontairement
       une autre décomposition, comme -20 puis +4. */
    const delta = desired - baseValue;
    const tens = delta >= 0
      ? Math.floor(delta/10)*10
      : Math.ceil(delta/10)*10;
    const units = delta - tens;

    if(tens < -100 || tens > 100 || units < -9 || units > 9) return false;

    calcTensDelta = tens;
    calcUnitsDelta = units;
    value = currentTarget();
    render(shouldScroll);
    return true;
  }

  function setupBeadDrag(){
    let bead=null;
    let pointerId=null;
    let startX=0;
    let startY=0;
    let beadNumber=0;
    let wasActive=false;
    let acted=false;
    const threshold=18;

    abacus.addEventListener("pointerdown",e => {
      const target=e.target.closest(".bead");
      if(!target || !abacus.contains(target)) return;

      leaveNumberEditing();
      bead=target;
      pointerId=e.pointerId;
      startX=e.clientX;
      startY=e.clientY;
      beadNumber=Number(bead.dataset.absolute);
      wasActive=beadNumber <= clamp(currentTarget(),0,100);
      acted=false;
      bead.classList.add("drag-source");
      bead.parentElement.classList.add("dragging");
      bead.style.setProperty("--drag-x","0px");
      bead.dataset.dragCue = wasActive ? "enlever →" : "← ajouter";
      try{bead.setPointerCapture(pointerId);}catch(_){ }
      // Pas de preventDefault ici : un geste vertical doit continuer à faire défiler le boulier.
    });

    abacus.addEventListener("pointermove",e => {
      if(!bead || e.pointerId!==pointerId || acted) return;
      const dx=e.clientX-startX;
      const dy=e.clientY-startY;

      // On laisse la priorité au défilement vertical du boulier.
      if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10){
        bead.style.setProperty("--drag-x","0px");
        bead.classList.remove("drag-cue");
        return;
      }

      // La boule suit légèrement le doigt : retour visuel immédiat avant même
      // que le seuil d'ajout/retrait soit franchi.
      const visualDx = clamp(dx,-38,38);
      bead.style.setProperty("--drag-x",`${visualDx}px`);
      bead.classList.toggle("drag-cue",Math.abs(dx) > 7);

      let desired=null;
      if(!wasActive && dx <= -threshold){
        // Tirer une boule du paquet de droite vers la gauche : elle et toutes
        // celles qui la précèdent rejoignent le groupe actif.
        desired=beadNumber;
      }else if(wasActive && dx >= threshold){
        // Tirer une boule active vers la droite l'enlève elle aussi : elle et
        // toutes les boules qui la suivent rejoignent le groupe inactif.
        // Exemple : tirer la boule 27 vers la droite laisse 26 boules actives.
        desired=beadNumber-1;
      }

      if(desired === null) return;
      if(setTargetFromBead(desired,false)){
        acted=true;
        if(e.cancelable) e.preventDefault();
      }
    });

    const finish=e => {
      if(!bead || (e && e.pointerId!==pointerId)) return;
      bead.classList.remove("drag-source","drag-cue");
      bead.style.setProperty("--drag-x","0px");
      delete bead.dataset.dragCue;
      if(bead.parentElement) bead.parentElement.classList.remove("dragging");
      try{bead.releasePointerCapture(pointerId);}catch(_){ }
      const didAct=acted;
      bead=null;
      pointerId=null;
      acted=false;
      if(didAct) scheduleScrollToValue(currentTarget());
    };

    abacus.addEventListener("pointerup",finish);
    abacus.addEventListener("pointercancel",finish);
  }

  function flashInvalidNumber(){
    numberDisplay.classList.remove("invalid");
    void numberDisplay.offsetWidth;
    numberDisplay.classList.add("invalid");
    setTimeout(() => numberDisplay.classList.remove("invalid"),350);
  }

  function handleNumberDigit(digit){
    if(mode !== "number") return;
    let candidate;
    if(numberTypingFresh || numberBuffer === "0") candidate = digit;
    else candidate = numberBuffer + digit;

    candidate = candidate.replace(/^0+(?=\d)/,"");
    const n = Number(candidate);
    if(!Number.isInteger(n) || n<0 || n>100){
      flashInvalidNumber();
      return;
    }
    numberTypingFresh=false;
    numberBuffer=String(n);
    setCurrentTarget(n);
  }

  function handleNumberBackspace(){
    if(mode !== "number") return;
    numberTypingFresh=false;
    numberBuffer = numberBuffer.length>1 ? numberBuffer.slice(0,-1) : "0";
    setCurrentTarget(Number(numberBuffer));
  }

  numberDisplay.addEventListener("pointerdown",e => {
    if(mode !== "number") return;
    if(numberHidden){
      numberHidden=false;
      numberVisibilityButton.textContent="Masquer";
      numberVisibilityButton.setAttribute("aria-pressed","false");
      numberVisibilityButton.title="Masquer le nombre";
      render(false);
    }
    numberTypingFresh=true;
    numberBuffer=String(value);
    numberDisplay.classList.add("editing");
    numberDisplay.focus({preventScroll:true});
    e.preventDefault();
  });

  numberDisplay.addEventListener("keydown",e => {
    if(mode !== "number") return;
    if(/^\d$/.test(e.key)){
      e.preventDefault();
      handleNumberDigit(e.key);
    }else if(e.key === "Backspace" || e.key === "Delete"){
      e.preventDefault();
      handleNumberBackspace();
    }else if(e.key === "Enter" || e.key === "Escape"){
      e.preventDefault();
      leaveNumberEditing();
      numberDisplay.blur();
    }
  });
  numberDisplay.addEventListener("blur",leaveNumberEditing);

  function clearVerification(){
    answerTens.classList.remove("correct","incorrect");
    answerUnits.classList.remove("correct","incorrect");
    verifyButton.classList.remove("correct","incorrect","incomplete");
    verifyButton.textContent = "Vérifier";
  }

  function verifyAnswer(){
    if(mode !== "calc") return;
    clearVerification();

    const expectedNow = currentTarget();
    if(expectedNow < 0 || expectedNow > 100){
      verifyButton.classList.add("incomplete");
      verifyButton.textContent = "Ajuste les unités";
      return;
    }

    if(answer.tens === "" || answer.units === ""){
      verifyButton.classList.add("incomplete");
      verifyButton.textContent = "Complète la réponse";
      if(answer.tens === "") answerTens.classList.add("incorrect");
      if(answer.units === "") answerUnits.classList.add("incorrect");
      return;
    }

    const entered = Number(answer.tens) * 10 + Number(answer.units);
    const expected = currentTarget();
    if(entered === expected){
      answerTens.classList.add("correct");
      answerUnits.classList.add("correct");
      verifyButton.classList.add("correct");
      verifyButton.textContent = "✓ Correct";
    }else{
      answerTens.classList.add("incorrect");
      answerUnits.classList.add("incorrect");
      verifyButton.classList.add("incorrect");
      verifyButton.textContent = "À revoir";
    }
  }

  function setActiveAnswer(which){
    if(mode !== "calc") return;
    activeAnswer=which;
    answerTens.classList.toggle("active",which==="tens");
    answerUnits.classList.toggle("active",which==="units");
    keypad.classList.add("show");
    const el = which==="tens" ? answerTens : answerUnits;
    el.focus({preventScroll:true});
  }

  function handleAnswerDigit(digit){
    if(mode !== "calc" || !activeAnswer) return;
    clearVerification();
    answer[activeAnswer]=digit;
    const next = activeAnswer==="tens" ? "units" : "tens";
    render(false);
    setActiveAnswer(next);
  }

  function handleAnswerBackspace(){
    if(mode !== "calc") return;
    clearVerification();
    if(!activeAnswer) setActiveAnswer("units");
    answer[activeAnswer]="";
    render(false);
  }

  function clearAnswer(){
    clearVerification();
    answer.tens="";
    answer.units="";
    render(false);
    setActiveAnswer("tens");
  }

  [answerTens,answerUnits].forEach((box,index) => {
    const which=index===0 ? "tens" : "units";
    box.addEventListener("pointerdown",e => {
      setActiveAnswer(which);
      e.preventDefault();
    });
    box.addEventListener("keydown",e => {
      if(/^\d$/.test(e.key)){
        e.preventDefault();
        activeAnswer=which;
        handleAnswerDigit(e.key);
      }else if(e.key==="Backspace" || e.key==="Delete"){
        e.preventDefault();
        activeAnswer=which;
        handleAnswerBackspace();
      }
    });
  });

  keypad.addEventListener("pointerdown",e => {
    const btn=e.target.closest("button");
    if(btn) e.preventDefault();
  });
  keypad.addEventListener("click",e => {
    const btn=e.target.closest("button");
    if(!btn) return;
    if(btn.dataset.digit !== undefined) handleAnswerDigit(btn.dataset.digit);
    else if(btn.dataset.action === "backspace") handleAnswerBackspace();
    else if(btn.dataset.action === "clear") clearAnswer();
    else if(btn.dataset.action === "verify") verifyAnswer();
  });


  function syncNumberVisibilityButton(){
    numberVisibilityButton.textContent = numberHidden ? "Afficher" : "Masquer";
    numberVisibilityButton.setAttribute("aria-pressed",numberHidden ? "true" : "false");
    numberVisibilityButton.title = numberHidden ? "Afficher le nombre" : "Masquer le nombre";
  }

  numberVisibilityButton.addEventListener("click",() => {
    leaveNumberEditing();
    numberHidden = !numberHidden;
    syncNumberVisibilityButton();
    render(false);
  });

  function returnToBase(){
    if(mode !== "calc" || baseValue === null) return;
    calcTensDelta=0;
    calcUnitsDelta=0;
    value=baseValue;
    answer.tens="";
    answer.units="";
    activeAnswer=null;
    clearVerification();
    keypad.classList.remove("show");
    answerTens.classList.remove("active");
    answerUnits.classList.remove("active");
    render();
  }

  baseResetButton.addEventListener("click",returnToBase);

  function startCalculation(){
    leaveNumberEditing();
    mode="calc";
    baseValue=value;
    calcTensDelta=0;
    calcUnitsDelta=0;
    answer.tens="";
    answer.units="";
    activeAnswer=null;
    clearVerification();
    keypad.classList.remove("show");
    answerTens.classList.remove("active");
    answerUnits.classList.remove("active");
    render();
  }

  function exitCalculation(){
    const result=clamp(currentTarget(),0,100);
    mode="number";
    baseValue=null;
    calcTensDelta=0;
    calcUnitsDelta=0;
    value=result;
    numberBuffer=String(result);
    answer.tens="";
    answer.units="";
    activeAnswer=null;
    clearVerification();
    keypad.classList.remove("show");
    answerTens.classList.remove("active");
    answerUnits.classList.remove("active");
    render();
  }

  calcTrigger.addEventListener("click",() => {
    if(mode === "number") startCalculation();
    else exitCalculation();
  });

  // Cliquer ailleurs ferme seulement l'état visuel d'édition du nombre.
  document.addEventListener("pointerdown",e => {
    if(mode === "number" && !numberDisplay.contains(e.target)) leaveNumberEditing();
  },true);

  function isFullscreen(){
    return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function syncFullscreenButton(){
    const active = isFullscreen();
    fullscreenButton.textContent = active ? "↙" : "⛶";
    fullscreenButton.setAttribute("aria-label",active ? "Quitter le plein écran" : "Passer en plein écran");
    fullscreenButton.title = active ? "Quitter le plein écran (Échap)" : "Passer en plein écran";
  }

  async function toggleFullscreen(){
    try{
      if(!isFullscreen()){
        const root = document.documentElement;
        if(root.requestFullscreen) await root.requestFullscreen();
        else if(root.webkitRequestFullscreen) root.webkitRequestFullscreen();
      }else{
        if(document.exitFullscreen) await document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }catch(_){
      // Certains navigateurs bloquent le plein écran hors d'une action utilisateur.
    }
    syncFullscreenButton();
  }

  fullscreenButton.addEventListener("click",toggleFullscreen);
  document.addEventListener("fullscreenchange",syncFullscreenButton);
  document.addEventListener("webkitfullscreenchange",syncFullscreenButton);
  document.addEventListener("keydown",e => {
    if(e.key === "Escape" && isFullscreen()){
      // Échap quitte déjà le plein écran nativement dans les navigateurs modernes.
      // Ce repli garde le même comportement là où l'événement est transmis à la page.
      if(document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  syncFullscreenButton();
  syncNumberVisibilityButton();
  buildRulers();
  buildAbacus();
  setupTensDrag();
  setupUnitsDrag();
  setupBeadDrag();
})();
</script>
</body>
</html>
